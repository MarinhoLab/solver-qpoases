name: Build and Upload Python Packages

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest','ubuntu-24.04-arm','windows-latest','macos-latest']
        python-version: ['3.12','3.13']

    steps:
      - uses: actions/checkout@v3
      - name: init submodules
        run: |
          git submodule update --init --recursive
          git fetch --prune --unshallow
      - name: Set up Python ${{ matrix.python-version }} (Github Hosted VMs)
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: configure (Ubuntu)
        if: startsWith(matrix.os,'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install libeigen3-dev
      - name: configure (macOS)
        if: startsWith(matrix.os,'macos')
        run: |
          brew install eigen
      - name: configure (Windows)
        if: startsWith(matrix.os,'windows')
        run: |
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat
          vcpkg integrate install
          vcpkg install eigen3:x64-windows
          cmd /c mklink /d c:\Tools\vcpkg c:\vcpkg 2>$null || true
          cd ~
      - name: build
        run: |
          python -m pip config set global.break-system-packages true
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
      - name: Rename wheel (Ubuntu Only)
        if: startsWith(matrix.os,'ubuntu')
        run: |
          sudo apt-get install rename
          cd dist
          ls -lah
          rename 's/linux/manylinux2014/' *
          cd ..
          cd ..
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}-py${{ matrix.python-version }}
          path: dist/


  upload:
      needs: build
      runs-on: ubuntu-latest
      # Only publish on pushes to main so that PRs and manual dispatches
      # don't trigger uploads to PyPI.
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      permissions:
        id-token: write
      steps:
        - uses: actions/download-artifact@v4 # Download all artifacts
          with:
            pattern: wheel-*
            path: dist/
            merge-multiple: true
        - name: Publish package distributions to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
