name: Build and Upload Python Packages

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest','ubuntu-24.04-arm','windows-latest','macos-latest']
        python-version: ['3.10','3.11','3.12','3.13','3.14']

    steps:
      - uses: actions/checkout@v7
      - name: init submodules
        run: |
          git submodule update --init --recursive
          git fetch --prune --unshallow
      - name: Set up Python ${{ matrix.python-version }} (Github Hosted VMs)
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: configure (Ubuntu)
        if: startsWith(matrix.os,'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install libeigen3-dev
      - name: configure (macOS)
        if: startsWith(matrix.os,'macos')
        run: |
          brew install eigen
      - name: configure (Windows)
        if: startsWith(matrix.os,'windows')
        run: |
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat
          vcpkg integrate install
          vcpkg install eigen3:x64-windows
          cmd /c mklink /d c:\Tools\vcpkg c:\vcpkg 2>$null || true
          cd ~
      - name: build
        run: |
          python -m pip config set global.break-system-packages true
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
      # PyPI requires a manylinux tag on Linux wheels. Renaming linux_* to
      # manylinux2014 claimed glibc 2.17, but these wheels are built on
      # Ubuntu 24.04 and reference GLIBC_2.38 symbols, so on older systems pip
      # installed them and the import failed. auditwheel checks the binary and
      # tags it with the manylinux policy it really satisfies (--plat auto),
      # e.g. manylinux_2_39, and removes the untagged wheel it repaired.
      - name: Repair wheel (Ubuntu only, manylinux tag)
        if: startsWith(matrix.os,'ubuntu')
        run: |
          sudo apt-get install -y patchelf
          python -m pip install auditwheel
          auditwheel repair --plat auto -w dist/ dist/*-linux_*.whl
          rm -f dist/*-linux_*.whl
          ls -lah dist
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          # One artifact per matrix job: runner.os is "Linux" for both
          # ubuntu-latest (x86_64) and ubuntu-24.04-arm (aarch64), so naming
          # by it made the two Linux jobs of each Python version share one
          # artifact, and only one of the two wheels reached PyPI.
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/


  upload:
      needs: build
      runs-on: ubuntu-latest
      # Only publish on pushes to main so that PRs and manual dispatches
      # don't trigger uploads to PyPI.
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      permissions:
        id-token: write
      steps:
        - uses: actions/download-artifact@v8 # Download all artifacts
          with:
            pattern: wheel-*
            path: dist/
            merge-multiple: true
        - name: Publish package distributions to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
